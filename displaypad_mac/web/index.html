<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DisplayPad</title>
<style>
[hidden] { display: none !important; }
:root {
  --bg: #f4f4f7; --panel: #ffffff; --text: #1d1d1f; --muted: #6b6b72; --line: #e2e2e8;
  --field: #ffffff; --chip: #eeeef2; --accent: #0a62f0; --accent-soft: #e6efff; --on-accent: #fff;
  --danger: #c4001a; --ok: #1a7f37; --warn-bg: #fff3e0; --warn-line: #f3c58a; --warn-text: #7a4300;
  --err-bg: #fdecee; --err-line: #f2b6bd; --pad: #17171c; --pad-edge: #2a2a32; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111114; --panel: #1b1b20; --text: #ececf1; --muted: #9a9aa5; --line: #2c2c34;
    --field: #141418; --chip: #26262d; --accent: #4c8dff; --accent-soft: #1d2a44; --on-accent: #fff;
    --danger: #ff6b7a; --ok: #4cc26b; --warn-bg: #2d2416; --warn-line: #5c4520; --warn-text: #f4c47e;
    --err-bg: #2f181c; --err-line: #5e2a32; --pad: #0c0c0f; --pad-edge: #26262e; --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111114; --panel: #1b1b20; --text: #ececf1; --muted: #9a9aa5; --line: #2c2c34;
  --field: #141418; --chip: #26262d; --accent: #4c8dff; --accent-soft: #1d2a44; --on-accent: #fff;
  --danger: #ff6b7a; --ok: #4cc26b; --warn-bg: #2d2416; --warn-line: #5c4520; --warn-text: #f4c47e;
  --err-bg: #2f181c; --err-line: #5e2a32; --pad: #0c0c0f; --pad-edge: #26262e; --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 6px 12px; }
button:hover:not(:disabled) { border-color: var(--muted); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
button.ghost { background: transparent; }
button.small { padding: 3px 9px; font-size: 13px; }
button.icon { padding: 3px 7px; min-width: 28px; }
button.danger { color: var(--danger); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=text], input[type=number], input:not([type]), select, textarea {
  width: 100%; background: var(--field); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px;
}
textarea { resize: vertical; min-height: 64px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; }
input[type=color] { width: 44px; height: 32px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--field); }
label { display: block; }
.lbl { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 4px; }
.check { display: flex; gap: 8px; align-items: center; }
small, .hint { color: var(--muted); font-size: 12px; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; background: var(--chip); padding: 1px 5px; border-radius: 5px; word-break: break-all; }

header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; font-size: 16px; display: flex; gap: 8px; align-items: center; }
.brand i { width: 22px; height: 14px; border-radius: 3px; background:
  linear-gradient(90deg, var(--accent) 0 30%, transparent 30% 35%, var(--accent) 35% 65%, transparent 65% 70%, var(--accent) 70%); opacity: .85; }
.pill { font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.pill.ok { color: var(--ok); } .pill.bad { color: var(--danger); }
.spacer { flex: 1; }
#dirty { font-size: 12px; color: var(--warn-text); }

#banners { padding: 0 20px; max-width: 1240px; margin: 0 auto; }
.banner { margin-top: 12px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--warn-line); background: var(--warn-bg); color: var(--warn-text); display: flex; gap: 12px; align-items: flex-start; }
.banner.err { border-color: var(--err-line); background: var(--err-bg); color: var(--danger); }
.banner div { flex: 1; }
.banner button { flex: none; }

main { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 20px; padding: 16px 20px 40px; max-width: 1240px; margin: 0 auto; align-items: start; }
@media (max-width: 980px) { main { grid-template-columns: 1fr; } }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); }
h2 { font-size: 15px; margin: 0 0 12px; }
h3 { font-size: 13px; margin: 18px 0 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
h3 small { text-transform: none; letter-spacing: 0; font-weight: 400; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tab { border-radius: 99px; padding: 5px 14px; }
.tab.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.tab .star { color: #e2a400; margin-left: 4px; }
.pagebar { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 16px; }

.device { background: linear-gradient(180deg, var(--pad-edge), var(--pad)); border-radius: 22px; padding: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.25); max-width: 760px; }
.grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.key { position: relative; aspect-ratio: 1; padding: 0; border-radius: 12px; border: 2px solid transparent; background: #000; overflow: hidden; }
.key img { width: 100%; height: 100%; display: block; image-rendering: auto; border-radius: 10px; }
.key .n { position: absolute; top: 3px; left: 5px; font-size: 10px; color: rgba(255,255,255,.55); text-shadow: 0 0 3px #000; }
.key .acts { position: absolute; right: 4px; bottom: 3px; font-size: 10px; color: rgba(255,255,255,.7); text-shadow: 0 0 3px #000; }
.key.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
.key.over { border-color: #fff; border-style: dashed; }
.key:hover:not(.sel) { border-color: rgba(255,255,255,.35); }
.device-foot { display: flex; justify-content: space-between; color: #8a8a96; font-size: 11px; margin-top: 14px; letter-spacing: .05em; }

.left > * + * { margin-top: 16px; }
.slider { display: flex; gap: 10px; align-items: center; }
.slider input { flex: 1; }
.slider output { min-width: 52px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }

aside.card { position: sticky; top: 72px; max-height: calc(100vh - 90px); overflow: auto; }
.ed-head { display: flex; align-items: center; gap: 8px; }
.ed-head h2 { margin: 0; }
.ed-head .tools { margin-left: auto; display: flex; gap: 4px; }
.ed-top { display: flex; gap: 14px; margin-top: 14px; align-items: center; }
.ed-top img { width: 112px; height: 112px; border-radius: 14px; background: #000; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--chip); }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 4px 12px; }
.seg button[aria-pressed=true] { background: var(--panel); box-shadow: var(--shadow); font-weight: 600; }
.palette { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; margin-top: 8px; }
.palette button { border: 0; background: transparent; font-size: 20px; padding: 3px 0; border-radius: 6px; }
.palette button:hover { background: var(--chip); }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); cursor: pointer; }
.drop:hover { border-color: var(--accent); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.row { display: flex; gap: 10px; align-items: flex-end; }
.row > * { flex: 1; }
.row > .none { flex: none; }
.stack > * + * { margin-top: 12px; }

.action { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); }
.action + .action { margin-top: 8px; }
.a-head { display: flex; gap: 6px; align-items: center; }
.a-head .num { width: 22px; height: 22px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--chip); font-size: 12px; font-weight: 600; }
.a-head select { flex: 1; }
.a-body { margin-top: 8px; }
.a-body > * + * { margin-top: 8px; }
.a-body small, .stack small { display: block; }
.kbd { display: flex; }
.kbd { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.kbd span { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 0 7px; background: var(--panel); font-size: 13px; min-width: 24px; text-align: center; }
button.rec { background: var(--danger); border-color: var(--danger); color: #fff; }
.empty { text-align: center; color: var(--muted); padding: 14px; border: 1.5px dashed var(--line); border-radius: 10px; }
#test-out { margin: 10px 0 0; white-space: pre-wrap; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; max-height: 220px; overflow: auto; }
#test-out .ok { color: var(--ok); } #test-out .bad { color: var(--danger); }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); color: var(--text); padding: 18px; width: min(420px, 92vw); }
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog p { margin: 0 0 12px; }
dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); opacity: 0; transition: .2s; background: var(--text); color: var(--bg); padding: 9px 16px; border-radius: 10px; pointer-events: none; max-width: 90vw; }
#toast.show { opacity: 1; transform: translateX(-50%); }
#gate { max-width: 520px; margin: 12vh auto; text-align: center; padding: 0 16px; }
header .seg button { padding: 3px 12px; }
#settings { max-width: 860px; margin: 0 auto; padding: 16px 20px 40px; }
#settings > .card + .card { margin-top: 16px; }
.set-row { display: flex; gap: 12px; align-items: center; justify-content: space-between; }
.set-row select { width: auto; min-width: 200px; }
.snippet { position: relative; margin: 0; padding: 10px 70px 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  white-space: pre-wrap; word-break: break-all; font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; }
.snippet button { position: absolute; top: 6px; right: 6px; }
.field-line { display: flex; gap: 6px; align-items: center; }
.crop-state { flex: 1; }
dialog.crop-dlg { width: min(560px, 94vw); }
dialog.crop-dlg h2 { margin: 0 0 6px; }
dialog.crop-dlg p.hint { margin: 0 0 10px; }
.crop-main { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 12px; }
.crop-stage { position: relative; width: min(300px, 70vw); aspect-ratio: 1; overflow: hidden; border-radius: 18px;
  cursor: grab; touch-action: none; outline-offset: 3px; box-shadow: 0 0 0 1px var(--line); }
.crop-stage.dragging { cursor: grabbing; }
.crop-stage img { position: absolute; max-width: none; pointer-events: none; user-select: none; -webkit-user-drag: none; }
.crop-side { display: flex; flex-direction: column; gap: 6px; }
.crop-result { width: 102px; height: 102px; border-radius: 12px; background: #000; }
.crop-quick { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.field-line code { flex: 1; padding: 6px 8px; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin: 0; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.ok-t { color: var(--ok); } .bad-t { color: var(--danger); }
a { color: var(--accent); }
</style>
</head>
<body>
<div id="gate" hidden>
  <h2 data-t="gate_title"></h2>
  <p class="hint" data-t-html="gate_text"></p>
</div>

<div id="app" hidden>
<header>
  <div class="brand"><i></i>DisplayPad</div>
  <span id="conn" class="pill" data-t="connecting"></span>
  <div class="seg" role="group" data-t-aria="nav_label">
    <button id="nav-keys" aria-pressed="true" data-t="nav_keys"></button>
    <button id="nav-settings" aria-pressed="false" data-t="nav_settings"></button>
  </div>
  <div class="spacer"></div>
  <span id="dirty" hidden data-t="unsaved"></span>
  <button id="discard" class="ghost" disabled data-t="discard"></button>
  <button id="save" class="primary" disabled data-t="save" data-t-title="save_title"></button>
</header>
<div id="banners"></div>

<main id="main">
  <section class="left">
    <div class="card">
      <div class="tabs" id="tabs" role="tablist" data-t-aria="pages_label"></div>
      <div class="pagebar">
        <button class="small" id="pg-show" data-t="pg_show" data-t-title="pg_show_title"></button>
        <button class="small" id="pg-start" data-t="pg_start"></button>
        <button class="small" id="pg-rename" data-t="pg_rename"></button>
        <button class="small danger" id="pg-delete" data-t="pg_delete"></button>
      </div>
      <div class="device">
        <div class="grid" id="grid"></div>
        <div class="device-foot"><span>MOUNTAIN DISPLAYPAD</span><span id="page-name"></span></div>
      </div>
      <p class="hint" style="margin:12px 0 0" data-t="grid_hint"></p>
    </div>
  </section>

  <aside class="card" id="editor" aria-live="polite"></aside>
</main>

<section id="settings" hidden></section>
</div>

<dialog id="dlg">
  <form method="dialog">
    <p id="dlg-msg"></p>
    <input id="dlg-input" maxlength="30" autocomplete="off">
    <div class="btns"><button type="button" id="dlg-cancel" data-t="cancel"></button><button value="ok" class="primary" id="dlg-ok" data-t="ok"></button></div>
  </form>
</dialog>
<div id="toast" role="status"></div>

// "#settings" (alone or after the token, "#t=...&settings") opens the Settings view.
const START_VIEW = /(^#|&)settings\b/.test(location.hash) ? "settings" : "keys";
const TOKEN = (() => {
  const m = location.hash.match(/t=([\w-]+)/);
  if (m) { try { sessionStorage.setItem("dp-token", m[1]); } catch {} history.replaceState(null, "", location.pathname); return m[1]; }
  try { return sessionStorage.getItem("dp-token") || ""; } catch { return ""; }
})();

const $ = (s, el = document) => el.querySelector(s);
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k in el && k !== "list" && k !== "spellcheck") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(c));
  return el;
}

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "X-Token": TOKEN, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (!r.ok) {
    let msg = "";
    try { msg = (await r.json()).error; } catch {}
    const err = new Error(msg || `error ${r.status}`);
    err.status = r.status;
    throw err;
  }
  return r;
}
const getJSON = (p) => api(p).then(r => r.json());

}

// ---------------------------------------------------------------- previews
const previews = new Map();
function preview(k) {
  const body = JSON.stringify(look(k));
  if (!previews.has(body)) {
    const p = api("/api/render", { method: "POST", body }).then(async r => ({
      url: URL.createObjectURL(await r.blob()),
      frames: +(r.headers.get("X-Frames") || 0), ms: +(r.headers.get("X-Duration") || 0) }));
    p.catch(() => previews.delete(body));
    previews.set(body, p);
  }
  return previews.get(body);
}
function paintKey(n) {
  const btn = $(`.key[data-n="${n}"]`);
  if (!btn) return;
  const k = spec(n);
  preview(k).then(p => { btn.querySelector("img").src = p.url; }).catch(() => {});
  btn.querySelector(".acts").textContent = (k?.actions?.length || 0) > 1 ? t("n_actions", { n: k.actions.length }) : "";
  btn.setAttribute("aria-label", t("key_n", { n }) + (k?.label ? ": " + k.label : k?.emoji ? ": " + k.emoji : t("key_empty")));
  btn.title = k?.label ? k.label + (k.hide_label ? t("label_hidden") : "") : "";
  if (n === sel) {
    const note = $("#ed-note");
    if (note) note.textContent = k ? t("note_key") : t("note_empty");
    preview(k).then(p => {
      const im = $("#ed-img"); if (im) im.src = p.url;

}

      return [h("div", { class: "row" }, inp, btn), kbd, hint(t("shortcut_hint")), accessNote];
    }
    case "text":
      return [h("textarea", { value: a.text || "", rows: 3, placeholder: t("text_ph2"), oninput: upd("text") }),
        hint(t("text_hint")), accessNote];
    case "media":
      return [h("select", { onchange: upd("key") }, MEDIA.map(v => h("option", { value: v, text: t("m_" + v), selected: a.key === v }))), accessNote];
    case "shell":
      return [h("textarea", { class: "mono", value: a.command || "", rows: 4, spellcheck: "false", placeholder: "open -a Safari https://apple.com", oninput: upd("command") }),
        hint(t("shell_hint"))];
    case "applescript":
      return [h("textarea", { class: "mono", value: a.script || "", rows: 4, spellcheck: "false", placeholder: t("as_ph"), oninput: upd("script") }),
        hint(t("as_hint"))];
    case "page":
      return [h("select", { onchange: upd("page") },
        h("option", { value: "back", text: t("page_back"), selected: a.page === "back" }),
        Object.keys(cfg.pages).map(p => h("option", { value: p, text: p, selected: a.page === p })))];
    case "screen_brightness":
      return [level(a, t("percent")), h("select", { onchange: upd("display") },
        [["all", t("disp_all")], ["builtin", t("disp_builtin")], ["external", t("disp_external")]]
          .map(([v, txt]) => h("option", { value: v, text: txt, selected: (a.display || "all") === v }))),
        hint(t("ddc_hint"))];
    case "brightness":
      return [level(a, t("percent")), hint(t("pad_bright_hint"))];
    case "delay":
      return [h("div", { class: "row" }, h("input", { type: "number", min: 0, step: 50, value: a.ms ?? 200, oninput: e => { a.ms = Math.max(0, parseInt(e.target.value || "0", 10)); changed(false); } }),
        h("span", { class: "none hint", text: t("ms") })), hint(t("delay_hint"))];
    case "configurator":
      return [hint(t("conf_hint"))];
  }
  return [];
}

function level(a, unit) {
  const v = String(a.value ?? "+10");
  let mode = v.startsWith("+") ? "up" : v.startsWith("-") ? "down" : "set";
  let num = Math.abs(parseInt(v, 10)) || 0;
  const write = () => { a.value = mode === "up" ? "+" + num : mode === "down" ? "-" + num : num; changed(false); };
  return h("div", { class: "row" },
    h("select", { onchange: e => { mode = e.target.value; write(); } },
      [["up", t("lvl_up")], ["down", t("lvl_down")], ["set", t("lvl_set")]].map(([m, txt]) => h("option", { value: m, text: txt, selected: mode === m }))),
    h("input", { type: "number", min: 0, max: 100, step: 5, value: num, oninput: e => { num = Math.max(0, Math.min(100, parseInt(e.target.value || "0", 10))); write(); } }),
    h("span", { class: "none hint", text: unit }));
}

// ---------------------------------------------------------------- shortcut recorder
function keyName(e) {
  const c = e.code;
  if (/^Key[A-Z]$/.test(c)) return c.slice(3).toLowerCase();
  if (/^Digit\d$/.test(c)) return c.slice(5);
  if (/^F\d{1,2}$/.test(c)) return c.toLowerCase();
  return KEY_NAMES[c] || null;
}
function onRecKey(e) {
  e.preventDefault(); e.stopPropagation();
  const k = keyName(e);
  if (!k) return; // only a modifier so far
  const mods = [e.ctrlKey && "ctrl", e.altKey && "alt", e.shiftKey && "shift", e.metaKey && "cmd"].filter(Boolean);
  recording.done([...mods, k].join("+"));
  stopRec();
}
function startRec(btn, done) {
  recording = { btn, done };
  btn.classList.add("rec"); btn.textContent = t("recording");
  addEventListener("keydown", onRecKey, true);
}
function stopRec() {
  if (!recording) return;
  removeEventListener("keydown", onRecKey, true);
  recording.btn.classList.remove("rec"); recording.btn.textContent = t("record");
  recording = null;
}

// ---------------------------------------------------------------- test / save
async function testKey() {
  const out = $("#test-out"), list = spec()?.actions || [];
  out.hidden = false; out.textContent = t("testing");
  try {
    const res = await postJSON("/api/test", { spec: { actions: list }, pages: cfg.pages });
    out.replaceChildren(...res.map((r, i) => h("div", {},
      h("span", { class: r.ok ? "ok" : "bad", text: (r.ok ? "✓ " : "✗ ") + `${i + 1}. ${typeName(r.type)}` }),
      r.output ? "\n" + r.output : "")));
    if (res.length < list.length && res.every(r => r.ok) === false) out.append(h("div", { class: "hint", text: t("not_run") }));
  } catch (e) { out.textContent = "✗ " + e.message; }
}
async function save(force = false) {
  if ($("#save").disabled) return;
  stopRec();
  busy++;
  try {
    const res = await api("/api/config", { method: "PUT", body: JSON.stringify(cfg), headers: force ? {} : { "X-Config-Rev": rev } }).then(r => r.json());
    rev = res.rev || rev;
    saved = JSON.stringify(cfg); changed(false);
    $("#banners .save-err")?.remove(); $("#banners .conflict")?.remove();
    toast(t("saved_toast"));
  } catch (e) {
    $("#banners .save-err")?.remove();
    if (e.status === 409) showConflict();
    else $("#banners").prepend(h("div", { class: "banner err save-err" }, h("div", {}, h("b", { text: t("not_saved") }), e.message)));
  } finally { busy--; }
}
async function discard() {
  if (!await ask(t("ask_discard"))) return;
  await load();
}
addEventListener("keydown", e => { if ((e.metaKey || e.ctrlKey) && e.key === "s" && !recording) { e.preventDefault(); save(); } });

// The file changed under us (another window, or an AI assistant through MCP).
function showConflict() {
  if ($("#banners .conflict")) return;
  $("#banners").prepend(h("div", { class: "banner err conflict" },
    h("div", {}, h("b", { text: t("conflict") }), t("conflict_hint")),
    h("button", { class: "small", onclick: () => load(), text: t("conflict_load") }),
    h("button", { class: "small", onclick: () => save(true), text: t("conflict_keep") })));
}
async function externalChange() {
  if (isDirty()) return showConflict();
  await load();
  toast(t("updated_elsewhere"));
}

// ---------------------------------------------------------------- status & permissions
function usesAccess() {
  return !!cfg && Object.values(cfg.pages).some(p => Object.values(p.keys).some(k => (k.actions || []).some(a => NEEDS_ACCESS.has(a.type))));
}
function renderStatus(down = false) {
  const c = $("#conn");
  if (down) { c.className = "pill bad"; c.textContent = t("svc_down"); }
  else if (status.connected) { c.className = "pill ok"; c.textContent = t("connected", { page: status.page }); }
  else { c.className = "pill bad"; c.textContent = t("disconnected"); }
  if (view === "settings") renderAbout(down);
  const box = $("#banners");
  const sig = down ? "down" : JSON.stringify([LANG, status.input_monitoring, status.accessibility && 1, usesAccess(), status.config_error]);
  if (sig === renderStatus.sig) return;
  renderStatus.sig = sig;
  box.querySelectorAll(".perm").forEach(b => b.remove());
  if (down) return;
  const py = () => h("code", { text: status.python_app || "Python.app" });
  const restart = () => h("button", { class: "small", onclick: restartService, text: t("restart") });
  if (status.input_monitoring !== "granted")
    box.append(h("div", { class: "banner perm" }, h("div", {},
      h("b", { text: t("perm_input_b") }), t("perm_input_1"), py(), t("perm_input_2")),
      h("button", { class: "small", onclick: () => perm("input"), text: t("open_settings") }), restart()));
  if (status.accessibility === false && usesAccess())
    box.append(h("div", { class: "banner perm" }, h("div", {},
      h("b", { text: t("perm_ax_b") }), t("perm_ax_1"), py(), "."),
      h("button", { class: "small", onclick: () => perm("accessibility"), text: t("open_settings") }), restart()));
  if (status.config_error)
    box.append(h("div", { class: "banner err perm" }, h("div", {}, h("b", { text: t("config_err") }), status.config_error)));
}
async function perm(which) {
  try { status = await postJSON("/api/permissions", { which }); renderStatus(); } catch (e) { toast(e.message); }
}
async function restartService() {
  try { await postJSON("/api/restart", {}); } catch {}
  toast(t("restarting"));
  setTimeout(poll, 6500);
}
let pollTimer;
async function poll() {
  clearTimeout(pollTimer);
  const wasAccess = status.accessibility;
  try { status = await getJSON("/api/status"); renderStatus(); }
  catch { renderStatus(true); }
  if (wasAccess !== status.accessibility && cfg) renderActions();
  if (cfg && !busy && rev && status.config_rev && status.config_rev !== rev) await externalChange().catch(() => {});
  pollTimer = setTimeout(poll, 3000);
}

// ---------------------------------------------------------------- settings
function applyTheme() {
  const th = cfg?.theme;
  if (th === "light" || th === "dark") document.documentElement.dataset.theme = th;
  else delete document.documentElement.dataset.theme;
}
function setLang(lang) {
  LANG = lang === "es" ? "es" : "en";
  try { localStorage.setItem("dp-lang", LANG); } catch {}
  applyStatic();
}
function renderAll() {
  applyStatic(); applyTheme();
  renderTabs(); renderGrid(); renderEditor();
  if (view === "settings") renderSettings();
  renderStatus.sig = null; renderStatus();
}
// Settings are saved at once, apart from the keys' Save button: the same change is
// applied to the loaded and the saved copy so it never shows up as unsaved.
async function setSetting(patch) {
  busy++;
  try {
    const res = await postJSON("/api/settings", patch);
    const apply = (o) => { for (const [k, v] of Object.entries(patch)) o[k] = k === "mcp" ? { ...(o.mcp || {}), ...v } : v; return o; };
    apply(cfg); saved = JSON.stringify(apply(JSON.parse(saved))); rev = res.rev || rev;
    if ("language" in patch) { setLang(patch.language); renderAll(); }
    if ("theme" in patch) applyTheme();
    changed(false);
    return true;
  } catch (e) {
    toast(t("setting_failed", { msg: e.message }));
    renderSettings();
    return false;
  } finally { busy--; }
}
function setView(v) {
  view = v;
  $("#main").hidden = v !== "keys"; $("#settings").hidden = v !== "settings";
  $("#nav-keys").setAttribute("aria-pressed", String(v === "keys"));
  $("#nav-settings").setAttribute("aria-pressed", String(v === "settings"));
  if (v === "settings") renderSettings(true);
}
let brightTimer;
async function renderSettings(refresh = false) {
  if (refresh || !mcpInfo) { try { mcpInfo = await getJSON("/api/mcp"); } catch {} }
  const row = (label, control) => h("label", { class: "set-row" }, h("span", { text: label }), control);
  const select = (value, opts, onchange) => h("select", { onchange }, opts.map(([v, txt]) => h("option", { value: v, text: txt, selected: value === v })));

  const general = h("div", { class: "card stack" }, h("h2", { text: t("set_general") }),
    row(t("set_language"), select(LANG, [["en", "English"], ["es", "Español"]], e => setSetting({ language: e.target.value }))),
    row(t("set_theme"), select(cfg.theme || "system", [["system", t("theme_system")], ["light", t("theme_light")], ["dark", t("theme_dark")]],
      e => setSetting({ theme: e.target.value }))),
    h("small", { text: t("set_applied") }));

  const out = h("output", { text: (cfg.brightness ?? 80) + " %" });
  const pad = h("div", { class: "card stack" }, h("h2", { text: "DisplayPad" }),
    h("div", {}, h("span", { class: "lbl", text: t("set_bright") }),
      h("div", { class: "slider" }, h("input", { type: "range", min: 0, max: 100, step: 5, value: cfg.brightness ?? 80, "aria-label": t("set_bright"),
        oninput: e => { out.textContent = e.target.value + " %"; clearTimeout(brightTimer);
          brightTimer = setTimeout(() => setSetting({ brightness: +e.target.value }), 200); } }), out),
      h("small", { text: t("set_bright_hint") })),
    h("label", { class: "check" }, h("input", { type: "checkbox", checked: cfg.press_feedback !== false,
      onchange: e => setSetting({ press_feedback: e.target.checked }) }), t("set_feedback")));

  const m = cfg.mcp || {}, info = mcpInfo || {};
  const secret = (s) => showToken ? s : "•".repeat(24);
  const snippet = (shown, copied = shown) => h("pre", { class: "snippet" }, shown,
    h("button", { class: "small", type: "button", onclick: () => copyText(copied), text: t("copy") }));
  const bridge = info.bridge || "";
  const desktop = (cmd) => JSON.stringify({ mcpServers: { displaypad: { command: cmd } } }, null, 2);
  const ai = h("div", { class: "card stack" }, h("h2", { text: t("set_ai") }),
    h("p", { class: "hint", style: "margin:0", text: t("ai_intro") }),
    h("label", { class: "check" }, h("input", { type: "checkbox", id: "s-mcp", checked: !!m.enabled,
      onchange: async e => { if (await setSetting({ mcp: { enabled: e.target.checked } })) renderSettings(true); } }), h("b", { text: t("ai_enable") })),
    m.enabled ? [
      h("div", {}, h("label", { class: "check" }, h("input", { type: "checkbox", checked: !!m.allow_run,
        onchange: e => setSetting({ mcp: { allow_run: e.target.checked } }) }), t("ai_run")), h("small", { text: t("ai_run_hint") })),
      h("div", {}, h("span", { class: "lbl", text: t("ai_url") }),
        h("div", { class: "field-line" }, h("code", { text: info.url || "" }),
          h("button", { class: "small", onclick: () => copyText(info.url || ""), text: t("copy") }))),
      h("div", {}, h("span", { class: "lbl", text: t("ai_token") }),
        h("div", { class: "field-line" }, h("code", { text: secret(info.token || "") }),
          h("button", { class: "small", onclick: () => { showToken = !showToken; renderSettings(); }, text: showToken ? t("ai_hide") : t("ai_show") }),
          h("button", { class: "small", onclick: () => copyText(info.token || ""), text: t("copy") }),
          h("button", { class: "small danger", onclick: newToken, text: t("ai_new") }))),
      h("h3", { text: t("ai_how") }),
      info.bridge_installed ? [
        h("b", { text: "Claude Code" }), h("small", { text: t("ai_cc_hint") }),
        snippet(`claude mcp add --scope user displaypad -- "${bridge}"`),
        h("b", { text: "Claude Desktop" }), h("small", { text: t("ai_cd_hint") }),
        snippet(desktop(bridge)),
      ] : h("small", { style: "color:var(--danger)", text: t("ai_no_bridge") }),
      h("b", { text: t("ai_other") }),
      h("small", { text: t("ai_other_http") }),
      snippet(`URL: ${info.url}\nAuthorization: Bearer ${secret(info.token || "")}`, `URL: ${info.url}\nAuthorization: Bearer ${info.token}`),
      info.bridge_installed ? [h("small", { text: t("ai_other_stdio") }), snippet(bridge)] : null,
      h("small", { text: t("ai_try") }),
      h("div", { class: "banner", style: "margin-top:0" }, h("div", { text: t("ai_warn") })),
    ] : h("small", { text: t("ai_off_note") }));

  const about = h("div", { class: "card stack" }, h("h2", { text: t("set_about") }),
    h("dl", { class: "kv", id: "about-kv" }),
    h("p", { class: "hint", style: "margin:0", text: t("about_ai") }),
    h("p", { style: "margin:0" }, h("a", { href: REPO_URL, target: "_blank", rel: "noopener", text: t("about_source") })));

  $("#settings").replaceChildren(general, pad, ai, about);
  renderAbout();
}
function renderAbout(down = false) {
  const kv = $("#about-kv");
  if (!kv) return;
  const yes = (ok, a, b) => h("span", { class: ok ? "ok-t" : "bad-t", text: ok ? a : b });
  const rows = [
    [t("about_version"), status.version || "—"],
    [t("about_service"), yes(!down, t("about_running"), t("svc_down"))],
    [t("about_device"), yes(!!status.connected, t("about_connected"), t("about_not_connected"))],
    [t("about_input"), yes(status.input_monitoring === "granted", t("allowed"), t("not_allowed"))],
    [t("about_ax"), yes(!!status.accessibility, t("allowed"), t("not_allowed"))],
    status.animation?.keys ? [t("about_anim"), t("about_anim_v", { keys: status.animation.keys, fps: status.animation.fps || "…" })] : null,
    [t("about_config"), h("code", { text: status.config_path || "" })],
    [t("about_log"), h("code", { text: status.log_path || "" })],
  ].filter(Boolean);
  kv.replaceChildren(...rows.flatMap(([k, v]) => [h("dt", { text: k }), h("dd", {}, v)]));
}
async function newToken() {
  if (!await ask(t("ai_new_ask"))) return;
  try { mcpInfo = await postJSON("/api/mcp/token", {}); toast(t("ai_new_done")); renderSettings(); }
  catch (e) { toast(e.message); }
}

// ---------------------------------------------------------------- boot
async function load() {
  const r = await api("/api/config");
  rev = r.headers.get("X-Config-Rev") || "";
  cfg = normalise(await r.json());
  cfg.start_page = cfg.pages[cfg.start_page] ? cfg.start_page : Object.keys(cfg.pages)[0];
  saved = JSON.stringify(cfg);
  if (!page || !cfg.pages[page]) page = status.page && cfg.pages[status.page] ? status.page : cfg.start_page;
  setLang(cfg.language || "en");
  $("#banners .conflict")?.remove();
  renderAll(); changed(false);
}

applyStatic();
$("#dlg-cancel").onclick = () => $("#dlg").close("cancel");
$("#save").onclick = () => save();
$("#discard").onclick = discard;
$("#nav-keys").onclick = () => setView("keys");
$("#nav-settings").onclick = () => setView("settings");
$("#pg-show").onclick = async () => {
  if (JSON.stringify(cfg.pages[page]) !== JSON.stringify(JSON.parse(saved).pages[page])) return toast(t("save_page_first"));
  await postJSON("/api/show-page", { page }); setTimeout(poll, 600);
};
$("#pg-start").onclick = () => { cfg.start_page = page; renderTabs(); changed(false); };
$("#pg-rename").onclick = () => renamePage();
$("#pg-delete").onclick = deletePage;

(async () => {
  if (!TOKEN) { $("#gate").hidden = false; return; }
  $("#app").hidden = false;
  try {
    status = await getJSON("/api/status");
    renderStatus();
    getJSON("/api/apps").then(a => { apps = a; }).catch(() => {});
    await load();
    if (START_VIEW === "settings") setView("settings");
    pollTimer = setTimeout(poll, 3000);
  } catch (e) {
    $("#app").hidden = true; $("#gate").hidden = false;
    $("#gate p").textContent = e.status === 401 ? t("gate_bad_token") : t("gate_no_service", { msg: e.message });
  }
})();
</script>
